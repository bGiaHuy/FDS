<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <!-- Center Anchor Node -->
  <g fill="#3974BD" stroke="#F8FAFC" stroke-width="1.8">
    <circle cx="160" cy="160" r="6" />
  </g>
  <circle cx="160" cy="160" r="18" stroke="#5B8EC9" stroke-width="1.0" stroke-dasharray="3 4" />

  <!-- Concentric & Elliptical Orbits -->
  <g stroke="#5B8EC9" stroke-width="1.35">
    <!-- Inner Orbit Ring -->
    <circle cx="160" cy="160" r="58" stroke-dasharray="4 6" opacity="0.9" />
    
    <!-- Middle Elliptical Orbit (tilted) -->
    <ellipse cx="160" cy="160" rx="104" ry="72" transform="rotate(-25 160 160)" stroke="#5B8EC9" stroke-width="1.4" />
    
    <!-- Outer Orbit Ring -->
    <circle cx="160" cy="160" r="136" stroke="#6F99D0" stroke-width="1.2" stroke-dasharray="5 7" opacity="0.8" />
    
    <!-- Cross-cutting Elliptical Orbit -->
    <ellipse cx="160" cy="160" rx="142" ry="64" transform="rotate(40 160 160)" stroke="#5B8EC9" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.85" />
  </g>

  <!-- Radial Rays & Angle Markers -->
  <g stroke="#6F99D0" stroke-width="1.0" stroke-dasharray="3 5" opacity="0.75">
    <line x1="160" y1="20" x2="160" y2="300" />
    <line x1="20" y1="160" x2="300" y2="160" />
    <line x1="60" y1="60" x2="260" y2="260" />
  </g>

  <!-- Orbiting Nodes (Fill #3974BD) -->
  <g fill="#3974BD">
    <!-- Nodes on Inner Orbit -->
    <circle cx="160" cy="102" r="4" />
    <circle cx="218" cy="160" r="3.5" />
    
    <!-- Nodes on Tilted Orbit -->
    <circle cx="76" cy="120" r="4" />
    <circle cx="244" cy="200" r="4.5" />

    <!-- Nodes on Outer Orbit -->
    <circle cx="160" cy="24" r="3.5" />
    <circle cx="282" cy="218" r="4" />
    <circle cx="38" cy="160" r="3.5" />
  </g>

  <!-- Satellite Hexagon on Orbit -->
  <g stroke="#3974BD" stroke-width="1.4" fill="#FFFFFF">
    <path d="M234 82 l13-7.5 13 7.5 v15 l-13 7.5-13-7.5z" />
  </g>
  <circle cx="247" cy="89.5" r="3" fill="#3974BD" />

  <!-- Micro Orbit Annotations -->
  <g fill="#3974BD" font-family="monospace" font-size="8.5" font-weight="600" letter-spacing="1">
    <text x="238" y="32">ORBIT // 03</text>
    <text x="24" y="304">R:136px</text>
  </g>
</svg>
