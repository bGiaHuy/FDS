<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 620" fill="none">
  <!-- Vertical Bus Tracks -->
  <g stroke="#5B8EC9" stroke-width="1.4">
    <!-- Main primary vertical line -->
    <line x1="56" y1="20" x2="56" y2="600" />
    <!-- Secondary parallel line -->
    <line x1="82" y1="50" x2="82" y2="570" stroke-dasharray="4 6" opacity="0.85" />
    
    <!-- Cross rungs and signal nodes -->
    <line x1="56" y1="80" x2="82" y2="80" />
    <line x1="56" y1="160" x2="82" y2="160" />
    <line x1="56" y1="240" x2="82" y2="240" />
    <line x1="56" y1="320" x2="82" y2="320" />
    <line x1="56" y1="400" x2="82" y2="400" />
    <line x1="56" y1="480" x2="82" y2="480" />
    <line x1="56" y1="560" x2="82" y2="560" />

    <!-- Stepped Signal Pulses & Offshoots -->
    <path d="M56 120 H 30 V 140 H 56" />
    <path d="M82 200 H 112 V 220 H 82" />
    <path d="M56 280 H 22 V 304 H 56" />
    <path d="M82 360 H 122 V 384 H 82" />
    <path d="M56 440 H 28 V 460 H 56" />
    <path d="M82 520 H 114 V 540 H 82" />

    <!-- Terminal end caps -->
    <path d="M46 20 H 66" />
    <path d="M46 600 H 66" />
  </g>

  <!-- Fine Calibration Scale Ticks -->
  <g stroke="#6F99D0" stroke-width="1.0">
    <line x1="48" y1="40" x2="56" y2="40" />
    <line x1="51" y1="60" x2="56" y2="60" />
    <line x1="48" y1="100" x2="56" y2="100" />
    <line x1="51" y1="120" x2="56" y2="120" />
    <line x1="48" y1="180" x2="56" y2="180" />
    <line x1="51" y1="200" x2="56" y2="200" />
    <line x1="48" y1="260" x2="56" y2="260" />
    <line x1="51" y1="280" x2="56" y2="280" />
    <line x1="48" y1="340" x2="56" y2="340" />
    <line x1="51" y1="360" x2="56" y2="360" />
    <line x1="48" y1="420" x2="56" y2="420" />
    <line x1="51" y1="440" x2="56" y2="440" />
    <line x1="48" y1="500" x2="56" y2="500" />
    <line x1="51" y1="520" x2="56" y2="520" />
    <line x1="48" y1="580" x2="56" y2="580" />
  </g>

  <!-- Node Dots & Pulses (Fill #3974BD) -->
  <g fill="#3974BD">
    <circle cx="56" cy="80" r="3.5" />
    <circle cx="82" cy="80" r="3" />
    <circle cx="30" cy="130" r="3.5" />
    <circle cx="112" cy="210" r="3.5" />
    <circle cx="56" cy="240" r="3.5" />
    <circle cx="82" cy="320" r="3.5" />
    <circle cx="22" cy="292" r="3.5" />
    <circle cx="122" cy="372" r="3.5" />
    <circle cx="56" cy="400" r="3.5" />
    <circle cx="28" cy="450" r="3.5" />
    <circle cx="114" cy="530" r="3.5" />
    <circle cx="56" cy="600" r="4" />
    <circle cx="56" cy="20" r="4" />
  </g>

  <!-- Vertical Micro Labels -->
  <g fill="#3974BD" font-family="monospace" font-size="8.5" font-weight="600" letter-spacing="1">
    <text x="94" y="75">CH.01</text>
    <text x="94" y="235">SIG_RX</text>
    <text x="94" y="395">BUS.08</text>
    <text x="94" y="555">SYNC</text>
  </g>
</svg>
